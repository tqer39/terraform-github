overrides:
  # 深い pattern の DoS 対策。採用根拠と互換性検証は docs/workflow.md を参照。
  braces: npm:@dieub/braces-depth-guard@3.0.3-pn.3
  'markdownlint-cli2>smol-toml': 1.9.1
  'micromark-extension-math>katex': 0.19.0
  'js-yaml@3>argparse': 2.0.1

# tldjs は同梱データを使うため、外部データ更新の postinstall は実行しない。
allowBuilds:
  tldjs: false

patchedDependencies:
  js-yaml@3.15.2: patches/js-yaml@3.15.2.patch

name: Terraform Plan

description: Terraform Plan

inputs:
  GITHUB_TOKEN:
    description: サードパーティの Action を実行するための権限を付与するための認証用トークン
    required: true
  GITHUB_APPS_TOKEN:
    description: GitHub App トークン
    required: true
  GHA_APP_ID:
    description: GitHub App の numeric App ID (一部 repo が ruleset bypass actor 等で利用)
    required: false
    default: ""
  working-directory:
    description: Terraform CLI 実行時のパス
    required: true

runs:
  using: composite
  steps:
    - name: Setup Terraform
      uses: ./.github/actions/setup-terraform
      with:
        working-directory: ${{ inputs.working-directory }}

    - name: Terraform Validate
      uses: ./.github/actions/terraform-validate
      with:
        working-directory: ${{ inputs.working-directory }}

    - name: Setup tfcmt
      uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
      with:
        install_args: aqua:suzuki-shunsuke/tfcmt

    - name: Terraform Plan
      id: terraform-plan
      run: |
        TARGET=$(basename ${{ inputs.working-directory }})
        tfcmt --var target:$TARGET plan -patch -skip-no-changes -- terraform plan -input=false -no-color -out=tfplan
      env:
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        TF_VAR_github_token: ${{ inputs.GITHUB_APPS_TOKEN }}
        TF_VAR_gha_app_id: ${{ inputs.GHA_APP_ID }}
      working-directory: ${{ inputs.working-directory }}
      shell: bash

    - name: Terraform Plan (failure) -> Status
      if: steps.terraform-plan.outcome == 'failure'
      run: exit 1
      shell: bash

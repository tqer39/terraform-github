name: Set Matrix
description: Dynamically determines which repository directories to process based on changes

inputs:
  repository:
    description: Repository root name, or all for every root (manual runs only)
    required: false
    default: ""

outputs:
  require_manual_apply:
    description: Shared changes require an explicit manual apply after plan review
    value: ${{ steps.set-matrix.outputs.require_manual_apply }}
  matrix:
    description: JSON array of repository directories to process
    value: ${{ steps.set-matrix.outputs.matrix }}

runs:
  using: composite
  steps:
    - name: Set Matrix
      id: set-matrix
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        TARGET_REPOSITORY: ${{ inputs.repository }}
      run: bash "${{ github.action_path }}/../../scripts/set_matrix.sh"

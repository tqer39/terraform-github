name: Terraform Shard
description: Setup once and process repository roots sequentially

inputs:
  repositories:
    description: JSON array of repository root names
    required: true
  shard-id:
    description: Stable shard number for cache isolation
    required: true
  apply:
    description: Explicit apply request for manual dispatch only
    default: "false"
  require-manual-apply:
    description: Disable automatic apply for shared changes
    required: true
  github-token:
    description: Token for PR comments
    required: true
  terraform-github-token:
    description: PAT for the GitHub provider
    required: true
  gha-app-id:
    description: Numeric App ID used by repository rulesets
    default: ""

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-terraform
      with:
        setup-only: "true"

    - uses: ./.github/actions/terraform-validate
      with:
        setup-only: "true"

    - name: Setup tfcmt
      uses: itkq/actions-tfcmt/setup@96a8e30f0403d8db60d94c73be26debb87fda65d # main

    - name: Prepare provider cache
      shell: bash
      run: mkdir -p "$RUNNER_TEMP/terraform-provider-cache"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/terraform-provider-cache
        key: providers-${{ runner.os }}-${{ runner.arch }}-${{ env.TERRAFORM_VERSION }}-${{ inputs.shard-id }}-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
        restore-keys: |
          providers-${{ runner.os }}-${{ runner.arch }}-${{ env.TERRAFORM_VERSION }}-${{ inputs.shard-id }}-

    - name: Validate, plan and optionally apply roots
      shell: bash
      env:
        REPOSITORIES: ${{ inputs.repositories }}
        EVENT_NAME: ${{ github.event_name }}
        MANUAL_APPLY: ${{ inputs.apply }}
        REQUIRE_MANUAL_APPLY: ${{ inputs.require-manual-apply }}
        TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/terraform-provider-cache
        TF_IN_AUTOMATION: "true"
        GITHUB_TOKEN: ${{ inputs.github-token }}
        TF_VAR_github_token: ${{ inputs.terraform-github-token }}
        TF_VAR_gha_app_id: ${{ inputs.gha-app-id }}
        METRICS_DIR: ${{ runner.temp }}/terraform-metrics
      run: bash "${{ github.action_path }}/../../scripts/terraform_shard.sh"

    - name: Upload timing and rate-limit metrics
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: terraform-metrics-${{ inputs.shard-id }}
        path: |
          ${{ runner.temp }}/terraform-metrics/roots.jsonl
          ${{ runner.temp }}/terraform-metrics/rate-limit-*.json
        retention-days: 14
        if-no-files-found: warn

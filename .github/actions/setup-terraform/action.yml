name: Setup terraform

description: Setup Terraform

inputs:
  setup-only:
    description: Install common tools without processing a root
    default: "false"
  working-directory:
    description: Terraform CLI 実行時のパス
    required: false

runs:
  using: composite
  steps:
    - name: Get current Terraform version
      run: echo "TERRAFORM_VERSION=$(grep '^terraform' mise.toml | awk -F'\"' '{print $2}')" >> $GITHUB_ENV
      shell: bash

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}

    - name: Terraform Format
      if: inputs.setup-only != 'true'
      run: terraform fmt -check -recursive -diff
      working-directory: ${{ inputs.working-directory }}
      shell: bash

    - name: Terraform Init
      if: inputs.setup-only != 'true'
      run: terraform init -input=false -lockfile=readonly
      working-directory: ${{ inputs.working-directory }}
      shell: bash

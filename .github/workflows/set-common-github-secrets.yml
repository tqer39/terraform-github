name: Distribute API Key

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify destinations without changing secrets
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  set-secrets:
    if: >-
      github.repository_owner == 'tqer39' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.DISTRIBUTOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.DISTRIBUTOR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.SECRET_DISTRIBUTION_REPOSITORIES }}
          permission-secrets: write

      - name: Set secrets in repositories
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          SECRET_DISTRIBUTION_REPOSITORIES: ${{ vars.SECRET_DISTRIBUTION_REPOSITORIES }}
          DRY_RUN: ${{ inputs.dry_run }}
          OPENROUTER_API_KEY: ${{ !inputs.dry_run && secrets.OPENROUTER_API_KEY || '' }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          ./scripts/set-common-github-secrets.sh "$REPOSITORY_OWNER"

name: Terraform - GitHub

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      repository:
        description: Repository root name, or all for all roots
        type: string
        required: true
      apply:
        description: Apply the reviewed changes (false runs plan only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: terraform-github-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_ENV_NAME: portfolio

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5
        with:
          install: true

      - name: Get validator cache key
        id: validator-cache-key
        run: |
          echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/renovate-npm" >> "$GITHUB_ENV"
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          const hook = readFileSync('lefthook.yml', 'utf8');
          const version = hook.match(/--package=renovate@(\d+\.\d+\.\d+) /)?.[1];
          if (!version) throw new Error('Pinned Renovate version not found');
          console.log(`node=${process.version}`);
          console.log(`renovate=${version}`);
          NODE

      - name: Cache Renovate validator
        id: validator-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/renovate-npm
          key: renovate-npm-${{ runner.os }}-${{ runner.arch }}-${{ steps.validator-cache-key.outputs.node }}-${{ steps.validator-cache-key.outputs.renovate }}

      - name: Install node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lefthook
        run: mise run lint

  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      shards: ${{ steps.set-matrix.outputs.shards }}
      require_manual_apply: ${{ steps.set-matrix.outputs.require_manual_apply }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set Matrix
        id: set-matrix
        uses: ./.github/actions/set-matrix
        with:
          repository: ${{ inputs.repository }}

  terraform:
    name: terraform (${{ join(matrix.shard.repositories, ', ') }})
    needs: set-matrix
    if: needs.set-matrix.outputs.matrix != '["_empty"]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: ${{ fromJson(needs.set-matrix.outputs.shards) }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select GitHub App token scope
        id: app-scope
        env:
          REPOSITORIES: ${{ toJson(matrix.shard.repositories) }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_APPLY: ${{ inputs.apply || false }}
          REQUIRE_MANUAL_APPLY: ${{ needs.set-matrix.outputs.require_manual_apply }}
        run: python3 .github/scripts/app_token_scope.py

      - name: Generate Terraform GitHub App token
        id: terraform-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        env:
          # The pinned action parses permission inputs from env; Variables is not yet in its metadata.
          INPUT_PERMISSION-ACTIONS-VARIABLES: ${{ steps.app-scope.outputs.variables }}
        with:
          client-id: ${{ vars.TERRAFORM_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.TERRAFORM_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.app-scope.outputs.repositories }}
          permission-administration: ${{ steps.app-scope.outputs.administration }}
          permission-contents: ${{ steps.app-scope.outputs.contents }}
          permission-environments: ${{ steps.app-scope.outputs.environments }}
          permission-secrets: ${{ steps.app-scope.outputs.secrets }}

      - name: AWS Credential
        uses: ./.github/actions/aws-credential
        with:
          oidc-iam-role: arn:aws:iam::072693953877:role/portfolio-terraform-github-deploy

      - name: Load and verify Discord Webhook
        if: contains(matrix.shard.repositories, 'kazokubi')
        run: python3 .github/scripts/load_discord_webhook.py

      - uses: ./.github/actions/terraform-shard
        with:
          repositories: ${{ toJson(matrix.shard.repositories) }}
          shard-id: ${{ matrix.shard.id }}
          apply: ${{ inputs.apply || false }}
          require-manual-apply: ${{ needs.set-matrix.outputs.require_manual_apply }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          terraform-github-token: ${{ steps.terraform-app.outputs.token }}
          gha-app-id: ${{ secrets.GHA_APP_ID }}
          release-secrets: ${{ contains(matrix.shard.repositories, 'kazokubi') && secrets.KAZOKUBI_RELEASE_SECRETS || '' }}

  delete-nochange-comments:
    needs: [set-matrix, terraform]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Delete no-change Terraform plan comments
        # cspell:ignore fromjson
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # jq variables must remain literal, without shell expansion.
          # shellcheck disable=SC2016
          comment_ids=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq '.[]
                | select(.user.login == "github-actions[bot]")
                | . as $comment
                | (try (.body
                    | capture("<!-- github-comment: (?<metadata>[^\\n]+) -->")
                    | .metadata | fromjson) catch null) as $metadata
                | select($metadata.Program == "tfcmt" and $metadata.Command == "plan"
                    and $metadata.WorkflowName == "Terraform - GitHub")
                | select($comment.body
                    | (contains("<pre><code>No changes. Your infrastructure matches the configuration.</code></pre>")
                        and (contains("<details>") | not))
                    or contains("<pre><code>Plan: 0 to add, 0 to change, 0 to destroy.</code></pre>"))
                | select($comment.body
                    | test("Warning:|Error:|:warning:|:x:|Objects have changed outside of Terraform") | not)
                | $comment.id')
          while read -r comment_id; do
            [[ -n "$comment_id" ]] || continue
            echo "Deleting comment: $comment_id"
            gh api -X DELETE "repos/$GH_REPO/issues/comments/$comment_id"
          done <<< "$comment_ids"

  workflow-result:
    needs: [lint, set-matrix, terraform, delete-nochange-comments]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check workflow result
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          MATRIX_RESULT: ${{ needs.set-matrix.result }}
          TARGET_MATRIX: ${{ needs.set-matrix.outputs.matrix }}
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
        run: |
          if [ "$LINT_RESULT" != "success" ] || [ "$MATRIX_RESULT" != "success" ]; then
            echo "Lint or target selection did not succeed"
            exit 1
          fi
          if [ "$TARGET_MATRIX" == '["_empty"]' ]; then
            echo "No repositories to process"
            exit 0
          fi
          if [ "$TERRAFORM_RESULT" != "success" ]; then
            echo "Terraform jobs did not succeed"
            exit 1
          fi
          echo "All jobs completed successfully"
